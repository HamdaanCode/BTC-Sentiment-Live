name: Daily ingest

on:
  schedule:
    # 00:15 UTC daily. Late enough that the previous day's BTC close is
    # finalised on yfinance, early enough that r/Bitcoin's "top of day"
    # listing still reflects the day we're pulling for.
    - cron: "15 0 * * *"
  workflow_dispatch:
    # Manual trigger from the Actions tab, for first run and backfills.

permissions:
  # Needed so the job can push the updated CSVs + JSON snapshots back
  # to the repo. Vercel then auto-redeploys from the push.
  contents: write

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need to push a commit back to main, so fetch full history
          # and use a token that allows pushes.
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-ingest.txt

      - name: Install ingest dependencies
        run: pip install -r scripts/requirements-ingest.txt

      - name: Fetch today's BTC price
        run: python scripts/daily_btc_ingest.py

      - name: Fetch today's r/Bitcoin sentiment
        # Reddit's RSS endpoint can occasionally 403 from shared CI IPs.
        # If it does, we still want the BTC commit to land, so continue.
        continue-on-error: true
        run: python scripts/daily_reddit_sentiment.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "chore(data): daily ingest ${TODAY}"
          git push
